name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auction-service, order-service]   # these run without external infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auction-service/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: auction-service/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build, and check the committed page matches the source
        run: npm run build && git diff --exit-code -- ../src/main/resources/static
  compile-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile every service
        run: for s in order-service inventory-service payment-service auction-service; do (cd $s && mvn -B -q -DskipTests compile); done
