server:
  port: 8084

spring:
  application:
    name: auction-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auctiondb
    username: orderapp
    password: orderapp

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC   # store and read every timestamp in UTC, whatever the machine's time zone

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false   # consumers deserialize into their own copy of the event class

auction:
  close-interval-ms: 1000

order-service-url: ${ORDER_SERVICE_URL:http://localhost:8081}   # where winners' orders are tracked

logging:
  level:
    com.akshit: INFO
