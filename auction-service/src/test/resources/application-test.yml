spring:
  datasource:
    url: jdbc:h2:mem:auctiontest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # store and read every timestamp in UTC, whatever the machine's time zone
  kafka:
    admin:
      auto-create: false   # tests replace the Kafka producer; no broker needed

auction:
  close-interval-ms: 3600000   # tests drive the closer by hand
