
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    restart: on-failure   # depends_on waits for start, not readiness; retry until dependencies answer
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: PLAINTEXT (port 29092) is for other containers on the
      # Docker network to reach Kafka via the hostname "kafka". PLAINTEXT_HOST
      # (port 9092) is for tools running on your own machine (mvn spring-boot:run,
      # the JUnit stress test, kafka-console-consumer, etc). Without this split,
      # containers and host processes can't both reach the broker correctly.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Auto-created topics get the same 3 partitions the services declare. Otherwise a consumer that starts
      # first sees a 1-partition topic, misses the 2 partitions added a moment later, and only notices them
      # at its next metadata refresh (5 minutes by default), stalling the SAGA for that long.
      KAFKA_NUM_PARTITIONS: 3

  # Creates every topic (3 partitions) before any service starts. Without this, a service that subscribes to a
  # topic that doesn't exist yet is assigned nothing until its next metadata refresh, and the SAGA stalls for
  # minutes on a fresh start.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - kafka
    restart: on-failure
    entrypoint: ["bash", "-c"]
    command:
      - |
        cub kafka-ready -b kafka:29092 1 120 &&
        for t in order-created order-rolled-back inventory-reserved inventory-rejected payment-confirmed payment-rejected auction-won; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orderapp
      POSTGRES_PASSWORD: orderapp
      POSTGRES_MULTIPLE_DATABASES: orderdb,inventorydb,paymentdb,auctiondb
    ports:
      - "5432:5432"
    volumes:
      - ./infra/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  order-service:
    restart: on-failure   # depends_on waits for start, not readiness; retry until dependencies answer
    build: ./order-service
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis

  inventory-service:
    restart: on-failure   # depends_on waits for start, not readiness; retry until dependencies answer
    build: ./inventory-service
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventorydb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis

  payment-service:
    restart: on-failure   # depends_on waits for start, not readiness; retry until dependencies answer
    build: ./payment-service
    depends_on:
      postgres:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paymentdb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  auction-service:
    restart: on-failure   # depends_on waits for start, not readiness; retry until dependencies answer
    build: ./auction-service
    depends_on:
      postgres:
        condition: service_started
      order-service:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auctiondb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ORDER_SERVICE_URL: http://order-service:8081
      TZ: UTC

volumes:
  pgdata:
